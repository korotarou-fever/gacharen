<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>めじるしチャーム ガチャシミュレーター</title>
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --primary: #ff6b8b;
      --primary-dark: #e65273;
      --secondary: #4dabf7;
      --text: #2b2d42;
      --muted: #8d99ae;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 18px 14px 64px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }
    header h1 {
      font-size: 1.4rem;
      margin: 0 0 4px;
    }
    header p {
      margin: 0;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    /* ガチャマシン風ディスプレイ */
    .machine-box {
      text-align: center;
      background: linear-gradient(135deg, #fff5f7 0%, #f0f7ff 100%);
      border: 2px dashed #ffc2d1;
    }
    .machine-title {
      font-weight: bold;
      font-size: 0.92rem;
      color: var(--primary-dark);
      margin-bottom: 12px;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 13px 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-1 {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 0 var(--primary-dark);
    }
    .btn-5 {
      background: var(--secondary);
      color: #fff;
      box-shadow: 0 4px 0 #228be6;
    }
    .btn-sub {
      background: #edf2f7;
      color: var(--text);
      font-size: 0.8rem;
      padding: 7px 12px;
    }

    /* 排出結果エリア */
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .result-header h2 {
      font-size: 1rem;
      margin: 0;
    }
    .shared-badge {
      display: none;
      background: #fff3bf;
      color: #e67700;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 4px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
      gap: 8px;
      min-height: 106px;
      align-items: center;
    }
    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 20px 0;
    }

    /* めじるしチャーム表現 */
    .charm-card {
      background: #fafbff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 4px 8px;
      text-align: center;
      animation: popIn 0.3s ease-out;
      position: relative;
      cursor: pointer;
    }
    .charm-card:active {
      transform: scale(0.97);
    }
    @keyframes popIn {
      0% { transform: scale(0.6) rotate(-8deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .new-tag {
      position: absolute;
      top: 5px;
      left: 5px;
      background: #ff6b8b;
      color: #fff;
      font-size: 0.62rem;
      font-weight: bold;
      padding: 1px 5px;
      border-radius: 6px;
    }
    .dup-tag {
      position: absolute;
      top: 5px;
      right: 5px;
      background: #e9ecef;
      color: #495057;
      font-size: 0.62rem;
      font-weight: bold;
      padding: 1px 5px;
      border-radius: 6px;
    }

    .charm-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 6px 0 4px;
    }
    .silicon-ring {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 4px solid rgba(130, 190, 255, 0.55);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.1);
      margin-bottom: -4px;
      z-index: 1;
    }
    .charm-body {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      box-shadow: 0 3px 6px rgba(0,0,0,0.08);
    }
    .charm-name {
      font-size: 0.78rem;
      font-weight: bold;
      margin-top: 4px;
    }
    .attach-chip {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.66rem;
      font-weight: bold;
      color: #1c7ed6;
      background: #e7f5ff;
      padding: 2px 7px;
      border-radius: 999px;
    }

    /* ▼ ビニール傘の持ち手プレビュー ▼ */
    .umbrella-card {
      padding-bottom: 14px;
    }
    .scene-switch {
      display: flex;
      gap: 6px;
    }
    .scene-btn {
      font-size: 0.72rem;
      padding: 4px 9px;
      border-radius: 999px;
      background: #edf2f7;
      color: var(--text);
      font-weight: bold;
    }
    .scene-btn.active {
      background: var(--secondary);
      color: #fff;
    }

    .umbrella-stage {
      position: relative;
      height: 255px;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.35s ease;
      border: 1px solid var(--border);
    }
    /* 背景テーマ */
    .umbrella-stage.scene-rain {
      background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 65%, #e2e8f0 100%);
    }
    .umbrella-stage.scene-sunny {
      background: linear-gradient(180deg, #bae6fd 0%, #fef9c3 75%, #dcfce7 100%);
    }
    .umbrella-stage.scene-evening {
      background: linear-gradient(180deg, #4c1d95 0%, #db2777 55%, #fdba74 100%);
    }

    /* 雨粒エフェクト */
    .rain-drops {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background-image: radial-gradient(rgba(59, 130, 246, 0.35) 1.5px, transparent 1.5px);
      background-size: 26px 34px;
      animation: rainFall 1.1s linear infinite;
    }
    .umbrella-stage.scene-rain .rain-drops {
      opacity: 1;
    }
    @keyframes rainFall {
      0% { background-position: 0 0; }
      100% { background-position: -12px 34px; }
    }

    .umbrella-svg {
      width: 240px;
      height: 240px;
      z-index: 2;
      overflow: visible;
    }

    /* ぶら下がりチャームの揺れアニメーション */
    .hanging-group {
      transform-origin: 146px 104px;
      animation: gentleSway 3.2s ease-in-out infinite;
    }
    .hanging-group.swing-hard {
      animation: tapSwing 0.9s ease-out;
    }
    @keyframes gentleSway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3.5deg); }
    }
    @keyframes tapSwing {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(18deg); }
      45% { transform: rotate(-14deg); }
      70% { transform: rotate(8deg); }
      88% { transform: rotate(-4deg); }
      100% { transform: rotate(0deg); }
    }

    .umbrella-caption {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .attached-name {
      font-weight: bold;
      color: var(--text);
    }

    /* ステータス＆図鑑 */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      margin-bottom: 12px;
    }
    .stat-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 8px 4px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
    }
    .stat-val {
      font-size: 1rem;
      font-weight: bold;
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .dex-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
      background: #fff;
      transition: 0.2s;
      cursor: pointer;
    }
    .dex-item.selected-charm {
      border: 2px solid var(--secondary);
      background: #f0f7ff;
    }
    .dex-item.locked {
      opacity: 0.45;
      filter: grayscale(100%);
      background: #f1f3f5;
      cursor: default;
    }
    .dex-count {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 999px;
      background: #edf2f7;
    }
    .dex-count.has-dup {
      background: #ffe3e3;
      color: #c92a2a;
    }

    /* ▼ カプセル開封アニメーション用オーバーレイ ▼ */
    .capsule-overlay {
      position: fixed;
      inset: 0;
      background: rgba(25, 28, 45, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      user-select: none;
    }
    .capsule-overlay.active {
      display: flex;
    }

    .stage-counter {
      color: #fff;
      font-size: 0.9rem;
      font-weight: bold;
      background: rgba(255,255,255,0.16);
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    .capsule-stage {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .burst-glow {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,230,128,0.5) 45%, rgba(255,255,255,0) 72%);
      transform: scale(0);
      opacity: 0;
      pointer-events: none;
    }
    .capsule-stage.opened .burst-glow {
      animation: burstFlash 0.55s ease-out forwards;
    }
    @keyframes burstFlash {
      0% { transform: scale(0.2); opacity: 1; }
      60% { transform: scale(1.45); opacity: 0.9; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    .capsule-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      z-index: 3;
    }
    .capsule-stage.rolling .capsule-wrapper {
      animation: capsuleRollIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .capsule-stage.shaking .capsule-wrapper {
      animation: capsuleShake 0.45s ease-in-out infinite;
    }
    @keyframes capsuleRollIn {
      0% { transform: translateX(-180px) rotate(-360deg) scale(0.5); opacity: 0; }
      70% { transform: translateX(10px) rotate(18deg) scale(1.03); opacity: 1; }
      100% { transform: translateX(0) rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes capsuleShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-10deg) scale(1.04); }
      40% { transform: rotate(10deg) scale(1.04); }
      60% { transform: rotate(-8deg) scale(1.02); }
      80% { transform: rotate(8deg) scale(1.02); }
    }

    .cap-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 130px;
      height: 65px;
      border-radius: 65px 65px 6px 6px;
      background: linear-gradient(135deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.45) 100%);
      border: 3px solid rgba(255,255,255,0.9);
      box-shadow: inset 0 6px 12px rgba(255,255,255,0.8);
      transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
    }
    .cap-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 130px;
      height: 65px;
      border-radius: 6px 6px 65px 65px;
      background: var(--cap-color, #ff6b8b);
      border: 3px solid rgba(255,255,255,0.75);
      box-shadow: inset 0 -8px 14px rgba(0,0,0,0.16);
      transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
    }

    .capsule-stage.opened .cap-top {
      transform: translate(-28px, -62px) rotate(-28deg);
      opacity: 0;
    }
    .capsule-stage.opened .cap-bottom {
      transform: translate(24px, 58px) rotate(22deg);
      opacity: 0;
    }

    .reveal-charm {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.2);
      opacity: 0;
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
    }
    .capsule-stage.opened .reveal-charm {
      transform: scale(1.25);
      opacity: 1;
    }
    .reveal-label {
      margin-top: 22px;
      color: #fff;
      font-size: 1.25rem;
      font-weight: bold;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      transition: 0.3s ease;
    }
    .reveal-label.show {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-new {
      display: inline-block;
      background: #ff6b8b;
      color: #fff;
      font-size: 0.78rem;
      padding: 2px 10px;
      border-radius: 999px;
      margin-bottom: 4px;
    }
    .skip-hint {
      margin-top: 28px;
      color: rgba(255,255,255,0.7);
      font-size: 0.82rem;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b2d42;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 300;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>☂️ めじるしチャーム ガチャ</h1>
      <p>全6種（各16.7%）｜1回 300円 シミュレーター</p>
    </header>

    <!-- ガチャ操作エリア -->
    <div class="card machine-box">
      <div class="machine-title">シリコンリング付き！どれが出るかな？</div>
      <div class="btn-row">
        <button id="btn1" class="btn-1" onclick="spinGacha(1)">1回まわす (¥300)</button>
        <button id="btn5" class="btn-5" onclick="spinGacha(5)">5連まわす (¥1,500)</button>
      </div>
    </div>

    <!-- 排出結果エリア -->
    <div class="card">
      <div class="result-header">
        <h2>今回の結果 <span id="sharedBadge" class="shared-badge">共有表示</span></h2>
        <button class="btn-sub" onclick="shareResult()">🔗 結果をURL共有</button>
      </div>
      <div id="resultGrid" class="result-grid">
        <div class="empty-msg">上のボタンからガチャをまわしてね！</div>
      </div>
    </div>

    <!-- ▼ ビニール傘の持ち手 装着プレビュー ▼ -->
    <div id="umbrellaCard" class="card umbrella-card">
      <div class="result-header">
        <h2>☂️ ビニール傘 装着プレビュー</h2>
        <div class="scene-switch">
          <button id="scRain" class="scene-btn active" onclick="setScene('rain')">☔ 雨</button>
          <button id="scSunny" class="scene-btn" onclick="setScene('sunny')">☀️ 晴</button>
          <button id="scEvening" class="scene-btn" onclick="setScene('evening')">🌆 夕</button>
        </div>
      </div>

      <div id="umbrellaStage" class="umbrella-stage scene-rain" onclick="swingCharm()">
        <div class="rain-drops"></div>
        <svg class="umbrella-svg" viewBox="0 0 240 240">
          <defs>
            <!-- ビニール傘の半透明ハンドル用グラデーション -->
            <linearGradient id="vinylHandle" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(255, 255, 255, 0.92)" />
              <stop offset="45%" stop-color="rgba(225, 240, 255, 0.68)" />
              <stop offset="100%" stop-color="rgba(180, 210, 245, 0.85)" />
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.22" />
            </filter>
          </defs>

          <!-- 傘の金属シャフト -->
          <rect x="86" y="-10" width="8" height="44" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />

          <!-- J字型のビニール傘ハンドル（本体） -->
          <path d="M 90 30 L 90 155 A 30 30 0 0 0 150 155 L 150 112"
                fill="none"
                stroke="url(#vinylHandle)"
                stroke-width="20"
                stroke-linecap="round"
                filter="url(#softShadow)" />

          <!-- ハンドルの外枠ハイライト -->
          <path d="M 90 30 L 90 155 A 30 30 0 0 0 150 155 L 150 112"
                fill="none"
                stroke="rgba(255, 255, 255, 0.9)"
                stroke-width="20"
                stroke-linecap="round"
                opacity="0.35" />
          <path d="M 85 34 L 85 153 A 25 25 0 0 0 135 153"
                fill="none"
                stroke="rgba(255, 255, 255, 0.95)"
                stroke-width="2.5"
                stroke-linecap="round" />

          <!-- ハンドル先端のキャップ -->
          <ellipse cx="150" cy="110" rx="10.5" ry="4.5" fill="rgba(255,255,255,0.9)" stroke="#cbd5e1" stroke-width="1.2" />

          <!-- ▼ 装着されたシリコンリング＆チャーム ▼ -->
          <g id="attachedCharmGroup" style="display:none;">
            <!-- シリコンリングの後ろ半分（ハンドルに巻き付く部分） -->
            <ellipse cx="150" cy="126" rx="14" ry="5.5" fill="none" id="ringBack" stroke="rgba(116, 192, 252, 0.85)" stroke-width="4.5" />

            <!-- ぶら下がって揺れるチャーム本体 -->
            <g id="hangingGroup" class="hanging-group">
              <!-- カニカン金具 -->
              <rect x="148" y="130" width="4" height="10" rx="2" fill="#94a3b8" />
              <circle cx="150" cy="142" r="3" fill="none" stroke="#94a3b8" stroke-width="1.8" />

              <!-- アクリルチャーム板 -->
              <rect id="charmPlate" x="122" y="145" width="56" height="56" rx="18"
                    fill="#e3fafc" stroke="#ffffff" stroke-width="3" filter="url(#softShadow)" />
              <!-- アクリルのツヤ反射 -->
              <path d="M 130 151 Q 150 148 168 153" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round" />

              <!-- 絵文字アイコン -->
              <text id="charmEmojiText" x="150" y="183" text-anchor="middle" font-size="30">🐻‍❄️</text>
            </g>

            <!-- シリコンリングの前半分（ハンドルの手前に見える部分） -->
            <path d="M 136 126 A 14 5.5 0 0 0 164 126" fill="none" id="ringFront" stroke="rgba(116, 192, 252, 0.95)" stroke-width="4.5" stroke-linecap="round" />
          </g>
        </svg>
      </div>

      <div class="umbrella-caption">
        <span id="attachedStatus">チャームをタップすると傘につけられます</span>
        <span>👆 傘タップで揺れる</span>
      </div>
    </div>

    <!-- コレクション＆ダブり状況 -->
    <div class="card">
      <div class="result-header">
        <h2>コレクション＆ダブり図鑑</h2>
        <button class="btn-sub" onclick="resetData()">リセット</button>
      </div>

      <div class="stats-bar">
        <div class="stat-box">
          <div class="stat-label">回した回数</div>
          <div id="totalSpins" class="stat-val">0回</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">使った金額</div>
          <div id="totalYen" class="stat-val">¥0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">コンプ率</div>
          <div id="compRate" class="stat-val">0 / 6</div>
        </div>
      </div>

      <div id="dexGrid" class="dex-grid"></div>
    </div>
  </div>

  <!-- カプセル開封アニメーション画面 -->
  <div id="capsuleOverlay" class="capsule-overlay" onclick="skipAnimation()">
    <div id="stageCounter" class="stage-counter">1 / 1</div>
    <div id="capsuleStage" class="capsule-stage">
      <div class="burst-glow"></div>
      <div id="revealCharm" class="reveal-charm"></div>
      <div class="capsule-wrapper">
        <div class="cap-top"></div>
        <div id="capBottom" class="cap-bottom"></div>
      </div>
    </div>
    <div id="revealLabel" class="reveal-label"></div>
    <div class="skip-hint">画面タップでスキップ</div>
  </div>

  <div id="toast" class="toast">共有URLをコピーしました！</div>

  <script>
    const ITEMS = [
      { id: 0, name: "しろくま",       emoji: "🐻‍❄️", color: "#e3fafc", ring: "rgba(116, 192, 252, 0.85)", capColor: "#74c0fc", weight: 1 },
      { id: 1, name: "プリン",         emoji: "🍮",   color: "#fff9db", ring: "rgba(255, 212, 59, 0.9)",   capColor: "#ffd43b", weight: 1 },
      { id: 2, name: "めんだこ",       emoji: "🐙",   color: "#ffe3e3", ring: "rgba(255, 135, 135, 0.9)",  capColor: "#ff8787", weight: 1 },
      { id: 3, name: "メロンソーダ",   emoji: "🥤",   color: "#d3f9d8", ring: "rgba(105, 219, 124, 0.9)",  capColor: "#69db7c", weight: 1 },
      { id: 4, name: "おにぎり",       emoji: "🍙",   color: "#f1f3f5", ring: "rgba(173, 181, 189, 0.9)",  capColor: "#adb5bd", weight: 1 },
      { id: 5, name: "シークレット猫", emoji: "🐈‍⬛", color: "#f3d9fa", ring: "rgba(218, 119, 242, 0.9)",  capColor: "#da77f2", weight: 1 }
    ];

    const PRICE_PER_SPIN = 300;
    const STORAGE_KEY = "mejirushi_gacha_save_v1";

    let state = {
      counts: Array(ITEMS.length).fill(0),
      totalSpins: 0,
      lastResults: [],
      attachedId: null
    };

    let animTimers = [];
    let pendingRender = null;

    function drawOne() {
      const totalWeight = ITEMS.reduce((sum, item) => sum + item.weight, 0);
      let r = Math.random() * totalWeight;
      for (const item of ITEMS) {
        if (r < item.weight) return item.id;
        r -= item.weight;
      }
      return 0;
    }

    function spinGacha(times) {
      document.getElementById("sharedBadge").style.display = "none";
      const results = [];
      const newFlags = [];

      for (let i = 0; i < times; i++) {
        const id = drawOne();
        const isNew = state.counts[id] === 0;
        state.counts[id] += 1;
        state.totalSpins += 1;
        results.push(id);
        newFlags.push(isNew);
      }

      state.lastResults = results;
      // 最後に引いたチャームを自動で傘に装着
      state.attachedId = results[results.length - 1];
      saveState();
      updateUrlParam(results);

      pendingRender = { results, newFlags };
      playCapsuleSequence(results, newFlags);
    }

    function playCapsuleSequence(results, newFlags) {
      clearAnimTimers();
      const overlay = document.getElementById("capsuleOverlay");
      overlay.classList.add("active");

      let index = 0;

      function showNextCapsule() {
        if (index >= results.length) {
          finishAnimation();
          return;
        }

        const item = ITEMS[results[index]];
        const isNew = newFlags[index];

        const counter = document.getElementById("stageCounter");
        const stage = document.getElementById("capsuleStage");
        const capBottom = document.getElementById("capBottom");
        const revealCharm = document.getElementById("revealCharm");
        const revealLabel = document.getElementById("revealLabel");

        counter.textContent = `${index + 1} / ${results.length}`;
        capBottom.style.setProperty("--cap-color", item.capColor);

        revealCharm.innerHTML = `
          <div class="silicon-ring" style="width:32px;height:32px;border-width:5px;border-color:${item.ring}"></div>
          <div class="charm-body" style="width:74px;height:74px;font-size:2.7rem;background:${item.color}">${item.emoji}</div>
        `;
        revealLabel.className = "reveal-label";
        revealLabel.innerHTML = `
          ${isNew ? `<div><span class="reveal-new">NEW!</span></div>` : ""}
          <div>${item.name}</div>
        `;

        stage.className = "capsule-stage";
        void stage.offsetWidth;
        stage.classList.add("rolling");

        const t1 = setTimeout(() => {
          stage.classList.remove("rolling");
          stage.classList.add("shaking");
        }, 550);

        const t2 = setTimeout(() => {
          stage.classList.remove("shaking");
          stage.classList.add("opened");
          revealLabel.classList.add("show");
        }, 1050);

        const nextDelay = results.length === 1 ? 2250 : 1850;
        const t3 = setTimeout(() => {
          index++;
          showNextCapsule();
        }, nextDelay);

        animTimers.push(t1, t2, t3);
      }

      showNextCapsule();
    }

    function clearAnimTimers() {
      animTimers.forEach(id => clearTimeout(id));
      animTimers = [];
    }

    function skipAnimation() {
      finishAnimation();
    }

    function finishAnimation() {
      clearAnimTimers();
      document.getElementById("capsuleOverlay").classList.remove("active");
      if (pendingRender) {
        renderResults(pendingRender.results, pendingRender.newFlags);
        renderDex();
        renderUmbrella();
        pendingRender = null;
      }
    }

    // ▼ 傘への装着処理 ▼
    function attachToUmbrella(id, shouldScroll = false) {
      if (state.counts[id] === 0 && !state.lastResults.includes(id)) {
        showToast("まだ持っていないチャームです！");
        return;
      }
      state.attachedId = id;
      saveState();
      renderUmbrella();
      renderDex();
      swingCharm();
      showToast(`「${ITEMS[id].name}」を傘につけました！`);

      if (shouldScroll) {
        document.getElementById("umbrellaCard").scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    function renderUmbrella() {
      const group = document.getElementById("attachedCharmGroup");
      const status = document.getElementById("attachedStatus");

      if (state.attachedId === null || state.attachedId === undefined || !ITEMS[state.attachedId]) {
        group.style.display = "none";
        status.innerHTML = "チャームをタップすると傘につけられます";
        return;
      }

      const item = ITEMS[state.attachedId];
      group.style.display = "inline";
      document.getElementById("ringBack").setAttribute("stroke", item.ring);
      document.getElementById("ringFront").setAttribute("stroke", item.ring);
      document.getElementById("charmPlate").setAttribute("fill", item.color);
      document.getElementById("charmEmojiText").textContent = item.emoji;
      status.innerHTML = `装着中：<span class="attached-name">${item.emoji} ${item.name}</span>`;
    }

    function swingCharm() {
      const hanging = document.getElementById("hangingGroup");
      if (!hanging) return;
      hanging.classList.remove("swing-hard");
      void hanging.offsetWidth;
      hanging.classList.add("swing-hard");
      setTimeout(() => hanging.classList.remove("swing-hard"), 950);
    }

    function setScene(scene) {
      const stage = document.getElementById("umbrellaStage");
      stage.className = `umbrella-stage scene-${scene}`;
      document.getElementById("scRain").classList.toggle("active", scene === "rain");
      document.getElementById("scSunny").classList.toggle("active", scene === "sunny");
      document.getElementById("scEvening").classList.toggle("active", scene === "evening");
    }

    function renderResults(resultIds, newFlags = []) {
      const grid = document.getElementById("resultGrid");
      if (!resultIds || resultIds.length === 0) {
        grid.innerHTML = `<div class="empty-msg">上のボタンからガチャをまわしてね！</div>`;
        return;
      }

      grid.innerHTML = resultIds.map((id, idx) => {
        const item = ITEMS[id];
        const count = state.counts[id];
        const isNew = newFlags[idx];
        return `
          <div class="charm-card" onclick="attachToUmbrella(${id}, true)">
            ${isNew ? `<span class="new-tag">NEW!</span>` : ""}
            ${count > 1 ? `<span class="dup-tag">所持${count}</span>` : ""}
            <div class="charm-visual">
              <div class="silicon-ring" style="border-color:${item.ring}"></div>
              <div class="charm-body" style="background:${item.color}">${item.emoji}</div>
            </div>
            <div class="charm-name">${item.name}</div>
            <div class="attach-chip">☂️ 傘につける</div>
          </div>
        `;
      }).join("");
    }

    function renderDex() {
      const ownedTypes = state.counts.filter(c => c > 0).length;
      document.getElementById("totalSpins").textContent = `${state.totalSpins}回`;
      document.getElementById("totalYen").textContent = `¥${(state.totalSpins * PRICE_PER_SPIN).toLocaleString()}`;
      document.getElementById("compRate").textContent = `${ownedTypes} / ${ITEMS.length}`;

      const dexGrid = document.getElementById("dexGrid");
      dexGrid.innerHTML = ITEMS.map((item, idx) => {
        const c = state.counts[idx];
        const dup = c > 1 ? c - 1 : 0;
        const isSelected = state.attachedId === idx && c > 0;
        return `
          <div class="dex-item ${c === 0 ? "locked" : ""} ${isSelected ? "selected-charm" : ""}" onclick="attachToUmbrella(${idx}, true)">
            <div class="charm-visual">
              <div class="silicon-ring" style="border-color:${item.ring}"></div>
              <div class="charm-body" style="background:${item.color}; width:44px; height:44px; font-size:1.6rem;">${item.emoji}</div>
            </div>
            <div class="charm-name">${item.name}</div>
            <div class="dex-count ${dup > 0 ? "has-dup" : ""}">
              ${c === 0 ? "未所持" : dup > 0 ? `所持${c} (ダブり${dup})` : "所持1"}
            </div>
          </div>
        `;
      }).join("");
    }

    function updateUrlParam(ids) {
      const url = new URL(window.location.href);
      url.searchParams.set("r", ids.join(","));
      window.history.replaceState({}, "", url);
    }

    function shareResult() {
      if (!state.lastResults || state.lastResults.length === 0) {
        showToast("先にガチャをまわしてください！");
        return;
      }
      const shareUrl = window.location.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast("結果URLをコピーしました！");
        });
      } else {
        prompt("このURLをコピーして共有してください：", shareUrl);
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.counts) && parsed.counts.length === ITEMS.length) {
            state = {
              counts: parsed.counts,
              totalSpins: parsed.totalSpins || 0,
              lastResults: parsed.lastResults || [],
              attachedId: parsed.attachedId !== undefined ? parsed.attachedId : null
            };
          }
        } catch (e) {}
      }

      const params = new URLSearchParams(window.location.search);
      const rParam = params.get("r");
      if (rParam) {
        const sharedIds = rParam.split(",")
          .map(n => parseInt(n, 10))
          .filter(n => !isNaN(n) && n >= 0 && n < ITEMS.length);
        if (sharedIds.length > 0) {
          state.lastResults = sharedIds;
          if (state.attachedId === null) {
            state.attachedId = sharedIds[sharedIds.length - 1];
          }
          document.getElementById("sharedBadge").style.display = "inline-block";
          renderResults(sharedIds, []);
          renderDex();
          renderUmbrella();
          return;
        }
      }

      renderResults(state.lastResults, []);
      renderDex();
      renderUmbrella();
    }

    function resetData() {
      if (!confirm("所持数と履歴をリセットしますか？")) return;
      state = { counts: Array(ITEMS.length).fill(0), totalSpins: 0, lastResults: [], attachedId: null };
      localStorage.removeItem(STORAGE_KEY);
      const url = new URL(window.location.href);
      url.searchParams.delete("r");
      window.history.replaceState({}, "", url);
      document.getElementById("sharedBadge").style.display = "none";
      renderResults([], []);
      renderDex();
      renderUmbrella();
      showToast("リセットしました");
    }

    loadState();
  </script>
</body>
</html>
