<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>めじるしチャーム ガチャシミュレーター</title>
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --primary: #ff6b8b;
      --primary-dark: #e65273;
      --secondary: #4dabf7;
      --text: #2b2d42;
      --muted: #8d99ae;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 1.5rem;
      margin: 0 0 6px;
    }
    header p {
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    /* ガチャマシン風ディスプレイ */
    .machine-box {
      text-align: center;
      background: linear-gradient(135deg, #fff5f7 0%, #f0f7ff 100%);
      border: 2px dashed #ffc2d1;
    }
    .machine-title {
      font-weight: bold;
      font-size: 0.95rem;
      color: var(--primary-dark);
      margin-bottom: 12px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.96); }
    .btn-1 {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 0 var(--primary-dark);
    }
    .btn-5 {
      background: var(--secondary);
      color: #fff;
      box-shadow: 0 4px 0 #2b8a3e00, 0 4px 0 #228be6;
    }
    .btn-sub {
      background: #edf2f7;
      color: var(--text);
      font-size: 0.85rem;
      padding: 8px 14px;
    }

    /* 排出結果エリア */
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .result-header h2 {
      font-size: 1.05rem;
      margin: 0;
    }
    .shared-badge {
      display: none;
      background: #fff3bf;
      color: #e67700;
      font-size: 0.78rem;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
      gap: 10px;
      min-height: 110px;
      align-items: center;
    }
    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 20px 0;
    }

    /* めじるしチャーム表現 */
    .charm-card {
      background: #fafbff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
      animation: popIn 0.28s ease-out;
      position: relative;
    }
    @keyframes popIn {
      0% { transform: scale(0.6) rotate(-8deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .new-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      background: #ff6b8b;
      color: #fff;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 6px;
    }
    .dup-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #e9ecef;
      color: #495057;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 6px;
    }

    .charm-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0 6px;
    }
    /* シリコンリング風 */
    .silicon-ring {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 4px solid rgba(130, 190, 255, 0.55);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.1);
      margin-bottom: -4px;
      z-index: 1;
    }
    .charm-body {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 3px 6px rgba(0,0,0,0.08);
    }
    .charm-name {
      font-size: 0.8rem;
      font-weight: bold;
      margin-top: 4px;
    }

    /* ステータス＆図鑑 */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      margin-bottom: 14px;
    }
    .stat-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 8px 4px;
    }
    .stat-label {
      font-size: 0.72rem;
      color: var(--muted);
    }
    .stat-val {
      font-size: 1.05rem;
      font-weight: bold;
    }

    .dex-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .dex-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      background: #fff;
      transition: 0.2s;
    }
    .dex-item.locked {
      opacity: 0.45;
      filter: grayscale(100%);
      background: #f1f3f5;
    }
    .dex-count {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 999px;
      background: #edf2f7;
    }
    .dex-count.has-dup {
      background: #ffe3e3;
      color: #c92a2a;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b2d42;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 99;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>☂️ めじるしチャーム ガチャ</h1>
      <p>全6種（各16.7%）｜1回 300円 シミュレーター</p>
    </header>

    <!-- ガチャ操作エリア -->
    <div class="card machine-box">
      <div class="machine-title">シリコンリング付き！どれが出るかな？</div>
      <div class="btn-row">
        <button class="btn-1" onclick="spinGacha(1)">1回まわす (¥300)</button>
        <button class="btn-5" onclick="spinGacha(5)">5連まわす (¥1,500)</button>
      </div>
    </div>

    <!-- 排出結果エリア -->
    <div class="card">
      <div class="result-header">
        <h2>今回の結果 <span id="sharedBadge" class="shared-badge">共有された結果を表示中</span></h2>
        <button class="btn-sub" onclick="shareResult()">🔗 結果をURL共有</button>
      </div>
      <div id="resultGrid" class="result-grid">
        <div class="empty-msg">上のボタンからガチャをまわしてね！</div>
      </div>
    </div>

    <!-- コレクション＆ダブり状況 -->
    <div class="card">
      <div class="result-header">
        <h2>コレクション＆ダブり図鑑</h2>
        <button class="btn-sub" onclick="resetData()">リセット</button>
      </div>

      <div class="stats-bar">
        <div class="stat-box">
          <div class="stat-label">回した回数</div>
          <div id="totalSpins" class="stat-val">0回</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">使った金額</div>
          <div id="totalYen" class="stat-val">¥0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">コンプ率</div>
          <div id="compRate" class="stat-val">0 / 6</div>
        </div>
      </div>

      <div id="dexGrid" class="dex-grid"></div>
    </div>
  </div>

  <div id="toast" class="toast">共有URLをコピーしました！</div>

  <script>
    // ▼ ラインナップ設定（ここを書き換えるだけでオリジナルガチャになります）
    const ITEMS = [
      { id: 0, name: "しろくま", emoji: "🐻‍❄️", color: "#e3fafc", ring: "rgba(116, 192, 252, 0.6)", weight: 1 },
      { id: 1, name: "プリン",   emoji: "🍮",   color: "#fff9db", ring: "rgba(255, 212, 59, 0.6)",  weight: 1 },
      { id: 2, name: "めんだこ", emoji: "🐙",   color: "#ffe3e3", ring: "rgba(255, 135, 135, 0.6)", weight: 1 },
      { id: 3, name: "メロンソーダ", emoji: "🥤", color: "#d3f9d8", ring: "rgba(105, 219, 124, 0.6)", weight: 1 },
      { id: 4, name: "おにぎり", emoji: "🍙",   color: "#f1f3f5", ring: "rgba(173, 181, 189, 0.6)", weight: 1 },
      { id: 5, name: "シークレット猫", emoji: "🐈‍⬛", color: "#f3d9fa", ring: "rgba(218, 119, 242, 0.6)", weight: 1 }
    ];

    const PRICE_PER_SPIN = 300;
    const STORAGE_KEY = "mejirushi_gacha_save_v1";

    // 所持状況データ
    let state = {
      counts: Array(ITEMS.length).fill(0),
      totalSpins: 0,
      lastResults: []
    };

    // 重み付きランダム抽選
    function drawOne() {
      const totalWeight = ITEMS.reduce((sum, item) => sum + item.weight, 0);
      let r = Math.random() * totalWeight;
      for (const item of ITEMS) {
        if (r < item.weight) return item.id;
        r -= item.weight;
      }
      return 0;
    }

    // ガチャ実行
    function spinGacha(times) {
      document.getElementById("sharedBadge").style.display = "none";
      const results = [];
      const newFlags = [];

      for (let i = 0; i < times; i++) {
        const id = drawOne();
        const isNew = state.counts[id] === 0;
        state.counts[id] += 1;
        state.totalSpins += 1;
        results.push(id);
        newFlags.push(isNew);
      }

      state.lastResults = results;
      saveState();
      updateUrlParam(results);
      renderResults(results, newFlags);
      renderDex();
    }

    // 結果描画
    function renderResults(resultIds, newFlags = []) {
      const grid = document.getElementById("resultGrid");
      if (!resultIds || resultIds.length === 0) {
        grid.innerHTML = `<div class="empty-msg">上のボタンからガチャをまわしてね！</div>`;
        return;
      }

      grid.innerHTML = resultIds.map((id, idx) => {
        const item = ITEMS[id];
        const count = state.counts[id];
        const isNew = newFlags[idx];
        return `
          <div class="charm-card">
            ${isNew ? `<span class="new-tag">NEW!</span>` : ""}
            ${count > 1 ? `<span class="dup-tag">所持${count}</span>` : ""}
            <div class="charm-visual">
              <div class="silicon-ring" style="border-color:${item.ring}"></div>
              <div class="charm-body" style="background:${item.color}">${item.emoji}</div>
            </div>
            <div class="charm-name">${item.name}</div>
          </div>
        `;
      }).join("");
    }

    // 図鑑＆ダブりカウント描画
    function renderDex() {
      const ownedTypes = state.counts.filter(c => c > 0).length;
      document.getElementById("totalSpins").textContent = `${state.totalSpins}回`;
      document.getElementById("totalYen").textContent = `¥${(state.totalSpins * PRICE_PER_SPIN).toLocaleString()}`;
      document.getElementById("compRate").textContent = `${ownedTypes} / ${ITEMS.length}`;

      const dexGrid = document.getElementById("dexGrid");
      dexGrid.innerHTML = ITEMS.map((item, idx) => {
        const c = state.counts[idx];
        const dup = c > 1 ? c - 1 : 0;
        return `
          <div class="dex-item ${c === 0 ? "locked" : ""}">
            <div class="charm-visual">
              <div class="silicon-ring" style="border-color:${item.ring}"></div>
              <div class="charm-body" style="background:${item.color}; width:44px; height:44px; font-size:1.6rem;">${item.emoji}</div>
            </div>
            <div class="charm-name">${item.name}</div>
            <div class="dex-count ${dup > 0 ? "has-dup" : ""}">
              ${c === 0 ? "未所持" : dup > 0 ? `所持${c} (ダブり${dup})` : "所持1"}
            </div>
          </div>
        `;
      }).join("");
    }

    // URLパラメータ更新（?r=0,2,1...）
    function updateUrlParam(ids) {
      const url = new URL(window.location.href);
      url.searchParams.set("r", ids.join(","));
      window.history.replaceState({}, "", url);
    }

    // URL共有ボタン
    function shareResult() {
      if (!state.lastResults || state.lastResults.length === 0) {
        showToast("先にガチャをまわしてください！");
        return;
      }
      const shareUrl = window.location.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast("結果URLをコピーしました！");
        });
      } else {
        prompt("このURLをコピーして共有してください：", shareUrl);
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    // 保存・読み込み・リセット
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.counts) && parsed.counts.length === ITEMS.length) {
            state = parsed;
          }
        } catch (e) {}
      }

      // URLに ?r=... がついていたら共有結果を優先表示
      const params = new URLSearchParams(window.location.search);
      const rParam = params.get("r");
      if (rParam) {
        const sharedIds = rParam.split(",")
          .map(n => parseInt(n, 10))
          .filter(n => !isNaN(n) && n >= 0 && n < ITEMS.length);
        if (sharedIds.length > 0) {
          state.lastResults = sharedIds;
          document.getElementById("sharedBadge").style.display = "inline-block";
          renderResults(sharedIds, []);
          renderDex();
          return;
        }
      }

      renderResults(state.lastResults, []);
      renderDex();
    }

    function resetData() {
      if (!confirm("所持数と履歴をリセットしますか？")) return;
      state = { counts: Array(ITEMS.length).fill(0), totalSpins: 0, lastResults: [] };
      localStorage.removeItem(STORAGE_KEY);
      const url = new URL(window.location.href);
      url.searchParams.delete("r");
      window.history.replaceState({}, "", url);
      document.getElementById("sharedBadge").style.display = "none";
      renderResults([], []);
      renderDex();
      showToast("リセットしました");
    }

    loadState();
  </script>
</body>
</html>
